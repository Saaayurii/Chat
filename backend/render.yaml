services:
  - type: web
    name: chat-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        fromDatabase:
          name: chat-mongodb
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: chat-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://yourdomain.com
      - key: WIDGET_URL
        value: https://widget.yourdomain.com
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CACHE_TTL
        value: 3600
      - key: CACHE_MAX
        value: 1000
      - key: LOG_LEVEL
        value: info
      - key: HEALTH_CHECK_TIMEOUT
        value: 5000
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@yourdomain.com

databases:
  - name: chat-mongodb
    databaseName: chat
    user: chat_user
    plan: starter

  - name: chat-redis
    plan: starter